# Laravel + PostgreSQL + Redis в Docker.
#
# Первый запуск после получения исходников без vendor/ и .env:
#   cp .env.example .env
#   docker compose run --rm --no-deps app composer install
#   docker compose run --rm --no-deps app php artisan key:generate
# Запуск: docker compose up -d --build ; приложение: http://localhost:8000
# Остановка: docker compose down
# Остановка с удалением данных БД и Redis: docker compose down -v
# Миграции применяются автоматически при старте app.
# После изменения кода задач очереди: docker compose restart queue
# Доступы к PostgreSQL и Redis берутся из .env (DB_*, REDIS_*).

name: testagents

services:
  app:
    build: ./docker/app
    image: testagents-app
    init: true
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - "./:/var/www/html"
    ports:
      - "8000:8000"
    command: ["sh", "-c", "php artisan migrate --force && exec php artisan serve --host=0.0.0.0 --port=8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  queue:
    image: testagents-app
    init: true
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - "./:/var/www/html"
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3"]
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${DB_USERNAME}", "-d", "${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - "redisdata:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisdata:
